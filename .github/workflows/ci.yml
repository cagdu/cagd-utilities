name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22, 24]

        services:
            redis:
                image: redis:7-alpine
                ports: ["6379:6379"]
                options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: cagd
                ports: ["5432:5432"]
                options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10

        env:
            TEST_REDIS_URL: redis://127.0.0.1:6379
            TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/cagd

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm pack --dry-run
